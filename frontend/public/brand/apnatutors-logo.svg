    <path d="M80,40 L138,48 Q150,54 148,70" stroke="#F5B324" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="148" cy="78" r="7" fill="#F5B324"/>
    <circle cx="80" cy="40" r="6" fill="#F5B324"/>
  </g>

  <text x="160" y="73" font-size="58" font-weight="800" letter-spacing="-1">
    <tspan fill="#1A1A2E">Apna</tspan><tspan fill="#6C4CE0">Tutors</tspan>
  </text>
  <text x="162" y="105" font-size="16" font-weight="500" letter-spacing="1.5" fill="#9A9284">FIND THE PERFECT TUTOR NEAR YOU</text>
</svg>
