  <defs>
    <linearGradient id="apnatutorsLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFA"/>
      <stop offset="100%" stop-color="#5B32C9"/>
    </linearGradient>
  </defs>

  <rect width="130" height="130" rx="30" fill="url(#apnatutorsLogoGradient)"/>

  <g transform="translate(14.69,7.54) scale(0.6175)">
    <path d="M80,78 L46,158" stroke="#FBF8F3" stroke-width="17" fill="none" stroke-linecap="round"/>
    <path d="M80,78 L114,158" stroke="#FBF8F3" stroke-width="17" fill="none" stroke-linecap="round"/>
    <path d="M58,128 L102,128" stroke="#F5B324" stroke-width="14" fill="none" stroke-linecap="round"/>
